<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#1a4a9c" />
    <meta name="description" content="MarketPulse 市场脉搏 · A股情绪与连板行情" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="脉搏" />
    <title>脉搏 · MarketPulse 市场脉搏</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://push2ex.eastmoney.com" />
    <link rel="preconnect" href="https://push2.eastmoney.com" />
    <link rel="preconnect" href="https://push2his.eastmoney.com" />
    <link rel="modulepreload" href="data.js" />
    <link rel="modulepreload" href="store.js" />
    <link rel="modulepreload" href="analytics.js" />
    <link rel="modulepreload" href="views.js" />
    <link rel="modulepreload" href="views-extra.js" />
    <link rel="modulepreload" href="version.js" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <div style="display:flex;align-items:center;gap:8px">
          <button class="hamburger" id="menuBtn" aria-label="菜单"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          <div class="brand"><span class="dot"></span> MarketPulse <span class="phase-badge" id="phaseBadge">连接中</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="date" id="dateLabel">--</span>
          <button class="refresh-btn" id="refreshBtn" title="刷新" aria-label="刷新"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></svg></button>
        </div>
      </div>
      <div class="status-strip" id="statusStrip"></div>
    </header>

    <div class="ptr" id="ptr"><span class="spin"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></svg></span> 正在刷新…</div>

    <div class="menu-scrim" id="menuScrim"></div>
    <nav class="menu-panel" id="menuPanel">
      <h3>行情工作台</h3>
      <button class="menu-item" data-view="market"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg></span> 全市场</button>
      <button class="menu-item" data-view="trades"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="7.5" width="18" height="12" rx="2"/><path d="M9 7.5V6a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v1.5M3 12.5h18"/></svg></span> 交易与持仓</button>
      <button class="menu-item" data-view="review"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h4"/></svg></span> 每日复盘</button>
      <button class="menu-item" data-view="ai"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="8" width="14" height="10" rx="2"/><path d="M12 8V5.5"/><circle cx="12" cy="4" r="1.2"/><path d="M9 12.5h.01M15 12.5h.01M9.5 15.5h5"/></svg></span> 决策助手</button>
      <button class="menu-item" data-view="settings"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></span> 设置</button>
    </nav>

    <main>
      <!-- 盘中 -->
      <section class="view active" id="view-intraday">
        <div class="banner hide" id="intradayBanner"></div>
        <div class="sec-title"><h2>涨停池</h2><span class="hint" id="ztHint">--</span></div>
        <div class="toolbar">
          <label class="search"><span aria-hidden="true"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input id="ztSearch" type="search" placeholder="搜索名称 / 代码" autocomplete="off" /></label>
          <div class="seg" id="ztSort">
            <button data-sort="boards" class="on">连板</button>
            <button data-sort="seal">封单</button>
            <button data-sort="pct">涨幅</button>
            <button data-sort="tier">评级</button>
          </div>
        </div>
        <div class="subtab" id="ztFilter">
          <button data-f="all" class="on">全部</button>
          <button data-f="playable">可打</button>
          <button data-f="S">S级</button>
          <button data-f="A">A级</button>
          <button data-f="B">B级</button>
        </div>
        <div class="list" id="ztList">
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w56"></i><i class="sk w36"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w48"></i><i class="sk w40"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w60"></i><i class="sk w32"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w44"></i><i class="sk w44"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
        </div>

        <details class="fold" id="dtFold">
          <summary><span class="fold-title">跌停池</span><span id="dtCount" class="hint">0</span></summary>
          <div class="body"><div class="list" id="dtList"></div></div>
        </details>
        <details class="fold" id="zbFold">
          <summary><span class="fold-title">炸板池</span><span id="zbCount" class="hint">0</span></summary>
          <div class="body"><div class="list" id="zbList"></div></div>
        </details>

        <div class="sec-title"><h2>昨日涨停 · 今日开盘预期差</h2><span class="hint" id="gapSummary">--</span></div>
        <div class="list" id="gapRows"></div>

        <div class="sec-title"><h2>风险雷达</h2></div>
        <div id="radar"></div>
      </section>

      <!-- 机会 -->
      <section class="view" id="view-opportunity">
        <div class="sec-title"><h2>机会池 · S/A/B 评级</h2><span class="hint" id="oppHint">--</span></div>
        <div id="opp"></div>
      </section>

      <!-- 梯队 -->
      <section class="view" id="view-ladder">
        <div class="sec-title"><h2>连板梯队</h2><span class="hint" id="ladderHint">--</span></div>
        <div id="ladderFull"></div>
      </section>

      <!-- 结构 -->
      <section class="view" id="view-structure">
        <div id="structure"></div>
      </section>

      <!-- 自选 -->
      <section class="view" id="view-watch">
        <div class="sec-title"><h2>自选观察</h2><span class="hint">本地存储</span></div>
        <div class="toolbar">
          <label class="search"><span aria-hidden="true">＋</span><input id="watchInput" type="search" placeholder="输入代码加入自选，如 600519" inputmode="numeric" autocomplete="off" /></label>
        </div>
        <div class="list" id="watchList"></div>
        <div class="empty hide" id="watchEmpty">还没有自选，输入代码添加。数据存于本机浏览器。</div>
      </section>

      <!-- 全市场（侧滑菜单） -->
      <section class="view" id="view-market">
        <div class="sec-title"><h2>全市场</h2><span class="hint" id="marketTotal">--</span></div>
        <div class="toolbar">
          <label class="search"><span aria-hidden="true"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span><input id="marketSearch" type="search" placeholder="搜索代码 / 名称" autocomplete="off" /></label>
          <select id="marketMarket" style="background:var(--surface-2);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);padding:0 8px;font-size:13px">
            <option value="">全部</option>
            <option value="sh">沪市</option>
            <option value="sz">深市</option>
            <option value="bj">北交所</option>
          </select>
        </div>
        <div class="list" id="marketList">
          <div class="sk-card"><div class="sk-lines"><i class="sk w36"></i><i class="sk w24"></i></div><div class="sk-col"><i class="sk w40"></i></div></div>
          <div class="sk-card"><div class="sk-lines"><i class="sk w44"></i><i class="sk w28"></i></div><div class="sk-col"><i class="sk w40"></i></div></div>
          <div class="sk-card"><div class="sk-lines"><i class="sk w32"></i><i class="sk w36"></i></div><div class="sk-col"><i class="sk w40"></i></div></div>
        </div>
        <div class="pager" id="marketPager"></div>
      </section>

      <!-- 交易（侧滑菜单） -->
      <section class="view" id="view-trades">
        <div id="tradesView"></div>
      </section>

      <!-- 复盘（侧滑菜单） -->
      <section class="view" id="view-review">
        <div id="reviewView"></div>
      </section>

      <!-- 决策助手（侧滑菜单） -->
      <section class="view" id="view-ai">
        <div id="aiView"></div>
      </section>

      <!-- 设置（侧滑菜单） -->
      <section class="view" id="view-settings">
        <div class="sec-title"><h2>设置</h2></div>
        <div class="set-row">
          <label for="setRefresh">自动刷新</label>
          <select id="setRefresh">
            <option value="0">关闭</option>
            <option value="8000">8 秒</option>
            <option value="15000">15 秒</option>
            <option value="30000">30 秒</option>
          </select>
        </div>
        <div class="set-row">
          <label for="setDate">行情日期 (YYYYMMDD)</label>
          <input id="setDate" type="number" inputmode="numeric" placeholder="留空=今日" />
        </div>
        <div class="set-row">
          <label for="setToken">数据接口 Token</label>
          <input id="setToken" type="text" autocomplete="off" placeholder="留空=内置默认" />
        </div>
        <div class="set-row">
          <label for="setNotify">信号变化通知（前台运行时）</label>
          <input id="setNotify" type="checkbox" style="flex:0 0 auto;width:20px;height:20px" />
        </div>
        <div class="set-row">
          <label>清空本地数据</label>
          <button class="btn" id="clearBtn" style="flex:0 0 auto;padding:0 14px;height:36px">清空自选</button>
        </div>
        <div class="about">
          版本 <span id="aboutVersion">--</span> · MarketPulse 市场脉搏 · 数据来自东方财富公开接口，由手机浏览器直接获取，无后端服务器。<br />
          行情有延迟，仅供信息展示，不构成投资建议。<br />
          封单/成交额/市值单位为元；涨停池价格为厘(÷1000)。非交易时段显示最近交易日快照。
        </div>
      </section>
    </main>

    <nav class="bottomnav">
      <button class="on" data-view="intraday"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9 16v-5M12.5 16V8M16 16v-3"/></svg></span>盘中</button>
      <button data-view="opportunity"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 11.4v1.2"/></svg></span>机会</button>
      <button data-view="ladder"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7 3v18M17 3v18M7 7.5h10M7 12h10M7 16.5h10"/></svg></span>梯队</button>
      <button data-view="structure"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="5" cy="6" r="2"/><circle cx="19" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M6.8 7.2l3.8 8.6M17.2 7.2l-3.8 8.6M7 6h10"/></svg></span>结构</button>
      <button data-view="watch"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8L12 3z"/></svg></span>自选</button>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">
      <div class="grip"></div>
      <div id="sheetBody"></div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="app.js" type="module"></script>
  </body>
</html>
