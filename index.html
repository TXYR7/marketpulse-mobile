<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#18181b" />
    <script>try { document.documentElement.dataset.theme = localStorage.getItem('mp-theme') === 'light' ? 'light' : 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
    <meta name="description" content="星脉 · A股情绪与连板行情看板" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="星脉" />
    <title>星脉 · 情绪行情看板</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://push2ex.eastmoney.com" />
    <link rel="preconnect" href="https://push2.eastmoney.com" />
    <link rel="preconnect" href="https://push2his.eastmoney.com" />
    <link rel="modulepreload" href="data.js" />
    <link rel="modulepreload" href="store.js" />
    <link rel="modulepreload" href="analytics.js" />
    <link rel="modulepreload" href="views.js" />
    <link rel="modulepreload" href="views-extra.js" />
    <link rel="modulepreload" href="version.js" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-row">
        <div style="display:flex;align-items:center;gap:8px">
          <!-- 2026-09-11 减法批:汉堡菜单按钮已随侧滑菜单整删 -->
          <div class="brand"><span class="dot"></span> 星脉 <span class="phase-badge" id="phaseBadge">连接中</span></div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="date" id="dateLabel">--</span>
          <button class="refresh-btn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题"><svg class="ic ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="ic ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
          <button class="refresh-btn" id="refreshBtn" title="刷新" aria-label="刷新"><svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></svg></button>
        </div>
      </div>
      <div class="status-strip" id="statusStrip"></div>
    </header>

    <div class="ptr" id="ptr"><span class="spin"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3v5h-5"/></svg></span> 正在刷新…</div>

    <!-- 2026-09-11 减法批:侧滑菜单(行情工作台)整链砍除——复盘/设置底部导航直达,
         交易与持仓在手机端是伪需求(实盘在同花顺/东财,本页纯研究参考) -->

    <div class="edge-jump" id="edgeJump">
      <button class="edge-btn" id="jumpTop" type="button" title="直达顶部" aria-label="直达顶部"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 15l-6-6-6 6"/></svg></button>
      <button class="edge-btn" id="jumpBottom" type="button" title="直达底部" aria-label="直达底部"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>

    <main>
      <!-- 盘中(2026-09-10 全盘对齐桌面:一页到底,机会/梯队/结构并入;自选页整链删) -->
      <section class="view active" id="view-intraday">
        <div class="banner hide" id="intradayBanner"></div>
        <!-- 2026-09-10 对齐桌面重排版:信息从重到轻——机会(答案层)最前 -->
        <div class="sec-title"><h2>机会池 · S/A/B 评级</h2><span class="hint" id="oppHint">--</span></div>
        <div id="opp"></div>

        <!-- 2026-09-11 拆解融合批:题材+龙头收进折叠组(研究信息,盘中默认不看) -->
        <details class="fold" id="structFold">
          <summary><span class="fold-title">题材强度 / 核心龙头</span><span class="hint" id="structHint">--</span></summary>
          <div class="body"><div id="structure"></div></div>
        </details>

        <div class="sec-title"><h2>涨停池</h2><span class="hint" id="ztHint">--</span></div>
        <!-- 2026-09-11 拆解融合批:连板梯队独立 section 取消,板位条并入涨停池头部(#ladderFull)——
             梯队=形状、涨停池=明细,同一批票不再两处滚动;点板位格滚到对应首卡 -->
        <div id="ladderFull"></div>
        <!-- 2026-09-10 减法批:搜索框/排序 seg/过滤 subtab 整链砍除(用户点名没用)——
             固定排序=连板降序·封单次序(与连板梯队视角一致),过滤由上方机会池 S/A/B 卡承担 -->
        <div class="list" id="ztList">
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w56"></i><i class="sk w36"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w48"></i><i class="sk w40"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w60"></i><i class="sk w32"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
          <div class="sk-card"><div class="sk sq"></div><div class="sk-lines"><i class="sk w44"></i><i class="sk w44"></i></div><div class="sk-col"><i class="sk w44"></i><i class="sk w28"></i></div></div>
        </div>

        <details class="fold" id="dtFold">
          <summary><span class="fold-title">跌停池</span><span id="dtCount" class="hint">0</span></summary>
          <div class="body"><div class="list" id="dtList"></div></div>
        </details>
        <details class="fold" id="zbFold">
          <summary><span class="fold-title">炸板池</span><span id="zbCount" class="hint">0</span></summary>
          <div class="body"><div class="list" id="zbList"></div></div>
        </details>

        <!-- 2026-09-09 减法批:预期差收进折叠(与桌面端迁复盘同口径)——9:26 看一眼后整天是死重,
             常驻展开还把风险雷达压到屏幕底部;折叠后雷达上浮为首屏可达的止手闸 -->
        <details class="fold" id="gapFold">
          <summary><span class="fold-title">昨日涨停 · 今日开盘预期差</span><span id="gapSummary" class="hint">--</span></summary>
          <div class="body"><div class="list" id="gapRows"></div></div>
        </details>

        <div class="sec-title"><h2>风险雷达</h2></div>
        <div id="radar"></div>
      </section>
      <!-- 2026-09-10 全盘对齐桌面:view-opportunity/view-ladder/view-structure 三个独立视图已删——
           内容容器(#opp/#ladderFull/#structure)迁入 view-intraday,渲染函数(views.js)原样复用;
           view-watch(自选页)整链删除——桌面 2026-09-09 同口径(实盘在同花顺/东财,本页只做研究参考),
           store.js 的 watch 数据层保留(旧数据可导出),只删界面与入口 -->

      <!-- 全市场（侧滑菜单） -->
      <!-- 2026-09-10 减法批:全市场视图+菜单项已砍——5900 只分 99 页在手机翻是伪需求,搜个股在东财 app 更快;renderMarket 随视图删 -->

      <!-- 2026-09-11 减法批:交易与持仓视图已随侧滑菜单整删(实盘在同花顺/东财,手机端纯研究参考;
           桌面端保留完整交易链——记录/复盘/行为偏差在桌面做) -->

      <!-- 复盘（侧滑菜单） -->
      <section class="view" id="view-review">
        <div id="reviewView"></div>
      </section>

      <!-- 2026-09-09 减法批:决策助手视图已删(与桌面端同口径) -->

      <!-- 设置（侧滑菜单） -->
      <section class="view" id="view-settings">
        <div class="sec-title"><h2>设置</h2></div>
        <div class="set-row">
          <label for="setRefresh">自动刷新</label>
          <select id="setRefresh">
            <option value="0">关闭</option>
            <option value="8000">8 秒</option>
            <option value="15000">15 秒</option>
            <option value="30000">30 秒</option>
          </select>
        </div>
        <div class="set-row">
          <label for="setDate">行情日期 (YYYYMMDD)</label>
          <input id="setDate" type="number" inputmode="numeric" placeholder="留空=今日" />
        </div>
        <div class="set-row">
          <label for="setToken">数据接口 Token</label>
          <input id="setToken" type="text" autocomplete="off" placeholder="留空=内置默认" />
        </div>
        <div class="set-row">
          <label for="setNotify">信号变化通知（前台运行时）</label>
          <input id="setNotify" type="checkbox" style="flex:0 0 auto;width:20px;height:20px" />
        </div>
        <!-- 2026-09-10 全盘对齐桌面:清空自选按钮已随自选页删除 -->
        <div class="about">
          版本 <span id="aboutVersion">--</span> · 星脉 · 数据来自东方财富公开接口，由手机浏览器直接获取，无后端服务器。<br />
          行情有延迟，仅供信息展示，不构成投资建议。<br />
          封单/成交额/市值单位为元；涨停池价格为厘(÷1000)。非交易时段显示最近交易日快照。
        </div>
      </section>
    </main>

    <nav class="bottomnav">
      <!-- 2026-09-10 全盘对齐桌面:机会/梯队/结构并入盘中页,自选已删——导航 5 键减 3 键 -->
      <button class="on" data-view="intraday"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9 16v-5M12.5 16V8M16 16v-3"/></svg></span>盘中</button>
      <button data-view="review"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 3h9l4 4v14H6z"/><path d="M15 3v4h4M9 12h6M9 16h4"/></svg></span>复盘</button>
      <button data-view="settings"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></span>设置</button>
    </nav>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">
      <div class="grip"></div>
      <div id="sheetBody"></div>
    </div>

    <div class="toast" id="toast" role="status"></div>

    <script src="app.js" type="module"></script>
  </body>
</html>
